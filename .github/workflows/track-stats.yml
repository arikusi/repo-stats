name: Track Repository Stats

on:
  schedule:
    - cron: "17 3 * * *" # Her gün 03:17 UTC
  workflow_dispatch:

concurrency:
  group: github-repo-stats
  cancel-in-progress: false

jobs:
  discover-repos:
    name: Discover Public Repositories
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - name: Discover all public repos
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
        run: |
          REPOS=$(gh api users/arikusi/repos --paginate \
            --jq '[.[] | select(.fork == false and .private == false and .name != "repo-stats") | .full_name]')

          COUNT=$(echo "$REPOS" | jq 'length')
          MATRIX=$(echo "$REPOS" | jq -c '{repo: .}')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT public repositories:"
          echo "$REPOS" | jq -r '.[]'

  run-stats:
    name: Stats — ${{ matrix.repo }}
    needs: discover-repos
    if: needs.discover-repos.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.discover-repos.outputs.matrix) }}
      fail-fast: false
      max-parallel: 1
    steps:
      - name: Run github-repo-stats
        uses: jgehrcke/github-repo-stats@v1.4.2
        with:
          repository: ${{ matrix.repo }}
          ghtoken: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
          databranch: github-repo-stats
          ghpagesprefix: https://arikusi.github.io/repo-stats

  # Pages branch-tetiklemeli modda her push ayri deploy baslatiyor ve
  # ust uste binen deploylar "Deployment failed" bildirimi yagdiriyordu.
  # Bunun yerine tum repolarin istatistigi toplandiktan sonra tek seferde
  # deploy ediyoruz. Pages build_type = workflow olmali.
  deploy-pages:
    name: Publish Reports to GitHub Pages
    needs: run-stats
    if: ${{ !cancelled() && needs.run-stats.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: github-repo-stats

      # Veri branch'inin kokunde index.html yok, o yuzden site koku ve
      # repo dizinleri 404 veriyordu. Artifact'e yuklemeden once kok icin
      # bir dizin sayfasi, her repo dizini icin de rapora yonlendiren bir
      # index uretiyoruz. Dosyalar sadece artifact'e girer, brancha commit
      # edilmez; yeni repo eklenince liste kendiliginden guncellenir.
      - name: Generate index pages
        run: |
          ROWS=""
          for report in arikusi/*/latest-report/report.html; do
            [ -f "$report" ] || continue
            dir=$(dirname "$(dirname "$report")")
            name=$(basename "$dir")
            ROWS="$ROWS<li><a href=\"$dir/latest-report/report.html\">$name</a></li>"
            cat > "$dir/index.html" <<REDIR
          <!DOCTYPE html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=latest-report/report.html">
          <title>$name stats</title>
          <a href="latest-report/report.html">$name report</a>
          REDIR
          done

          UPDATED=$(date -u +"%Y-%m-%d %H:%M UTC")
          cat > index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>arikusi repo stats</title>
          <style>
            :root { color-scheme: light dark; }
            body { font-family: system-ui, sans-serif; max-width: 40rem;
                   margin: 4rem auto; padding: 0 1.5rem; line-height: 1.6; }
            h1 { font-size: 1.4rem; }
            ul { list-style: none; padding: 0; }
            li { margin: 0.4rem 0; }
            a { text-decoration: none; }
            a:hover { text-decoration: underline; }
            footer { margin-top: 3rem; font-size: 0.8rem; opacity: 0.6; }
          </style>
          </head>
          <body>
          <h1>Repository stats</h1>
          <p>Daily traffic reports for <a href="https://github.com/arikusi">arikusi</a> public repositories.</p>
          <ul>$ROWS</ul>
          <footer>Updated $UPDATED · generated by <a href="https://github.com/jgehrcke/github-repo-stats">github-repo-stats</a></footer>
          </body>
          </html>
          HTML

          echo "Generated root index with $(echo "$ROWS" | grep -o '<li>' | wc -l) entries"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload reports artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
